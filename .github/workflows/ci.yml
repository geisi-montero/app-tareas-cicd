# Pipeline CI/CD: se ejecuta en cada push y pull request.
name: CI/CD

on:
  workflow_dispatch:   # permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Análisis estático (ESLint)
        run: npm run lint
      - name: Pruebas unitarias y de integración con cobertura
        run: npm test
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
      - name: Construir imagen Docker
        run: docker build -t plantilla-devops-itla:${{ github.sha }} .

  deploy-pages:
    name: Despliegue a GitHub Pages
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
